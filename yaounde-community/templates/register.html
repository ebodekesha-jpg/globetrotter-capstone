{% extends "base.html" %}
{% block title %}Join in — Yaoundé Community Explorer{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <h2>Join the community</h2>
    <p class="auth-sub">Create a free account to review places and save your itinerary.</p>
    <div class="form-error" id="formError"></div>
    <form id="registerForm">
      <div class="form-field">
        <label for="name">Full name</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" minlength="4" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login_page') }}{{ '?next=' + request.args.get('next') if request.args.get('next') }}">Log in</a></p>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('formError');
  errBox.style.display = 'none';
  try {
    await api('/api/register', {
      method: 'POST',
      body: JSON.stringify({
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    const next = new URLSearchParams(window.location.search).get('next');
    window.location.href = (next && next.startsWith('/')) ? next : '/';
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = 'block';
  }
});
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Log in — Yaoundé Community Explorer{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="auth-sub">Log in to review places and manage your itinerary.</p>
    <div class="form-error" id="formError"></div>
    <form id="loginForm">
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <p class="auth-switch">New here? <a href="{{ url_for('register_page') }}{{ '?next=' + request.args.get('next') if request.args.get('next') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('formError');
  errBox.style.display = 'none';
  try {
    await api('/api/login', {
      method: 'POST',
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    const next = new URLSearchParams(window.location.search).get('next');
    window.location.href = (next && next.startsWith('/')) ? next : '/';
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = 'block';
  }
});
</script>
{% endblock %}
